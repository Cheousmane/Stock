# SIDIBE CORPORATE - Nginx server block (production)
# Place dans /etc/nginx/sites-available/ton-domaine.com et symlink vers sites-enabled.
# Utilise la redirection SPA : toutes les routes inconnues => index.php (app Laravel), 
# ce qui permet a /admin/dashboard et toutes les pages Vue d'etre servies au refresh.

server {
    listen 80;
    server_name ton-domaine.com www.ton-domaine.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ton-domaine.com www.ton-domaine.com;

    root /var/www/ton-domaine.com/public;
    index index.php index.html;

    # Certificats Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/ton-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ton-domaine.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cache des assets Vite (public/build) - 1 an, immutable
    location ~* ^/build/.*\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: fichiers et dossiers reels d'abord, sinon index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_read_timeout 120;
    }

    location ~ /\\. {
        deny all;
    }

    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/ton-domaine.com-access.log;
    error_log  /var/log/nginx/ton-domaine.com-error.log;
}